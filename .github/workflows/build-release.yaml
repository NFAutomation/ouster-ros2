name: Build and Release DEB Packages

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Name/Tag of the release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-deb:
    name: Build DEB (${{ matrix.arch }})
    # Dynamically switches to a native ARM64 machine or standard x86 machine
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-22.04-arm  # Native GitHub ARM64 Runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # Respects your manual UI branch dropdown selection
          path: src/ouster-ros2
          submodules: recursive

      - name: Build DEB inside Docker
        run: |
          # No manual architecture platforms required—Docker natively targets the host machine CPU
          docker run --rm -i \
            -v ${{ github.workspace }}:/workspace \
            ros:humble-ros-base \
            /bin/bash << 'EOF'
          
          set -e
          apt-get update
          apt-get install -y python3-bloom fakeroot dpkg-dev debhelper dh-python python3-rosdep git
          
          # Eliminate Git dubious ownership constraints introduced by the Docker-Host layer
          git config --global --add safe.directory '*'
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          cd /workspace/src/ouster-ros2
          rosdep update
          rosdep install --from-paths . --ignore-src -y --rosdistro humble
          
          # Stage the root LICENSE file down so Bloom doesn't crash generating copyrights
          if [ -f "LICENSE" ]; then
            cp LICENSE ouster-sensor-msgs/
            cp LICENSE ouster-ros/
          fi
          
          # 1. Build the messages package
          echo "Building package: ouster-sensor-msgs"
          cd /workspace/src/ouster-ros2/ouster-sensor-msgs
          bloom-generate rosdebian --os-name ubuntu --os-version jammy --ros-distro humble
          fakeroot debian/rules binary
          
          # Install the local messages package so the driver can resolve it as a workspace dependency
          cd /workspace/src/ouster-ros2
          dpkg -i *.deb || apt-get install -f -y
          
          # 2. Build the core driver package
          echo "Building package: ouster-ros"
          cd /workspace/src/ouster-ros2/ouster-ros
          bloom-generate rosdebian --os-name ubuntu --os-version jammy --ros-distro humble
          fakeroot debian/rules binary
          
          # 3. Export all compiled packages out to the host runner workspace folder
          mkdir -p /workspace/output
          cp /workspace/src/ouster-ros2/*.deb /workspace/output/
          
          EOF

      - name: Upload DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ouster-ros2-${{ matrix.arch }}-deb
          path: output/*.deb
          retention-days: 5

  release:
    name: Publish Release
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Download DEB Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_name }}
          name: Release ${{ inputs.inputs.release_name }}
          files: artifacts/*.deb
          generate_release_notes: true
